name: daily

on:
  schedule:
    - cron: "30 4 */8 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: آوردن فایل‌های ریپو
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب ابزارها
        run: |
          npm init -y
          npm i playwright
          npx playwright install --with-deps chromium
          npm i playwright-extra puppeteer-extra-plugin-stealth

      - name: اجرای اسکرپر
        run: node scraper.mjs

      - name: آپلود فایل دیباگ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug.html

      - name: ثبت و انتشار
        run: |
          git config user.name "daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update: $(date -u +%F)"
          git push
